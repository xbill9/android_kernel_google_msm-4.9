# Phones sargo-test uses, all at once: <machine> <checks>. "local" is the machine running it;
# any other name is an SSH host with one Pixel 3a on USB (adb and fastboot installed there).
# Checks: unit (unit tests), smoke, hw (hardware check), vts (VTS net), cts (CTS_MODS).
# Each phone must run one of these 24.0 userdebug builds with an unlocked bootloader.
# cts and hw go on the phone with a working SIM: CtsNetTestCases stops at its setup check
# without one ("The device has no SIM card inserted"), and hw-check tests the SIM and modem.
local          cts,hw
192.168.50.45  vts
192.168.50.58  unit,smoke
# yoga9i: a second phone without a SIM runs every check that needs none, inside the CTS time.
yoga9i         unit,smoke,vts
